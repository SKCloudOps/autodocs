# Release workflow: build the action and update release tags for GitHub Marketplace.
# When you publish (or edit) a release with a semantic tag (e.g. v1.0.0), this job:
# 1. Builds the TypeScript action into dist/
# 2. Force-pushes the tag to a commit containing action.yml + dist/index.js
# 3. Updates major/minor tags (e.g. v1, v1.0) so users can pin to @v1 or @v1.0
#
# To publish to the Marketplace: create a release on GitHub, then check
# "Publish this Action to the GitHub Marketplace" in the release form.
# See RELEASE.md for step-by-step instructions.

name: Release to Marketplace

on:
  release:
    types: [published, edited]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for build-and-tag-action to push tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Build and update release tags
        uses: JasonEtco/build-and-tag-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
