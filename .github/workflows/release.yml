# Release workflow: build the action and update release tags for GitHub Marketplace.
# Triggers:
# - Manual: Actions → "Release to Marketplace" → Run workflow (choose a tag).
# - On release: when you publish or edit a release with a semantic tag (e.g. v1.0.0).
# The job builds the action, then force-pushes the tag with action.yml + dist/index.js.
# See RELEASE.md for Marketplace publishing steps.

name: Release to Marketplace

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build and update (e.g. v1.0.0). Required when run manually.'
        required: true
        default: 'v1.0.0'
  release:
    types: [published, edited]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for build-and-tag-action to push tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Build and update release tags
        uses: JasonEtco/build-and-tag-action@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
