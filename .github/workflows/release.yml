# Release workflow: build the action and update release tags for GitHub Marketplace.
# Triggers:
# - Manual: Actions → "Release to Marketplace" → Run workflow. Builds from the branch you run from and always updates/creates the v1 tag.
# - On release: when you publish or edit a release with a semantic tag (e.g. v1.0.0); that tag and v1 are updated.
# See RELEASE.md for Marketplace publishing steps.

name: Release to Marketplace

on:
  workflow_dispatch:
  release:
    types: [published, edited]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for build-and-tag-action to push tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manual: use the branch the workflow runs from (e.g. main). Release: use the release tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Build and update release tags
        uses: JasonEtco/build-and-tag-action@v2
        with:
          # Manual run: always update v1. Release event: update the release tag (v1 is also updated by build-and-tag for v1.x.x)
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'v1' || github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
